[project]
name = "g3ms-pcp"
version = "0.1.0"
description = "Small point-cloud utilities built with PyTorch"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Kittipong Tapyou", email = "kittipong.tpy@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "laspy>=2.7.0",
    "numpy>=2.0.0",
    "polars>=1.0.0",
    "torch>=2.0.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/G3MS-Lab/pcp"
Repository = "https://github.com/G3MS-Lab/pcp"
Issues = "https://github.com/G3MS-Lab/pcp/issues"

[project.optional-dependencies]
dev = [
    "nbformat>=5.11.1",
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]
laz = [
    "laspy[lazrs]>=2.5.0",
]
all = [
    "laspy[lazrs]>=2.5.0",
    "nbformat>=5.11.1",
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pcp"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.venv",
    "/data",
    "/notebooks",
]

